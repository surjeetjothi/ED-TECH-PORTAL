services:
  # ─────────────────────────────────────────────────────────────────────────────
  # BACKEND: FastAPI Python Web Service (also serves the frontend HTML/JS)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: classbridge-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false   # Paste your Supabase PostgreSQL URL in Render dashboard
      - key: USE_POSTGRES
        value: "true"
      - key: RENDER
        value: "true"
      - key: JWT_SECRET
        sync: false   # Generate a secure random string in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # Comma-separated list of allowed origins (optional)
      - key: GROQ_API_KEY
        sync: false   # Required for AI features
      - key: GOOGLE_CLIENT_ID
        sync: false   # Optional: For Google OAuth
      - key: SMTP_EMAIL
        sync: false   # Optional: kept as SMTP fallback for local dev
      - key: SMTP_PASSWORD
        sync: false   # Optional: kept as SMTP fallback for local dev
      - key: RESEND_API_KEY
        sync: false   # REQUIRED for email on free tier — get from resend.com
      - key: RESEND_FROM_EMAIL
        sync: false   # e.g. noreply@yourdomain.com — must be verified in Resend
      - key: ADMIN_LOGIN_EMAIL
        value: "info@noblenexus-ie.com"
      - key: ADMIN_LOGIN_PASSWORD
        sync: false   # Set in Render dashboard
      - key: TEACHER_LOGIN_ALIAS
        value: "teachernoblenexus@gmail.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # Optional: For image uploads
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
